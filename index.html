<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Class Routine</title>

  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>

<h2 class="title">SUB Spring 2026 CSE (63) Class Schedule</h2>

<div class="form">
  <select id="day">
    <option>Sunday</option>
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
  </select>

<div class="time-group">
  <div class="time-field">
    <label for="start">Start Time</label>
    <input type="time" id="start">
  </div>

  <div class="time-field">
    <label for="end">End Time</label>
    <input type="time" id="end">
  </div>
</div>

  <input type="text" id="subject" placeholder="Subject">
  <input type="text" id="teacher" placeholder="Teacher">
  <input type="text" id="room" placeholder="Room">

  <button onclick="addClass()">Add Class</button>
</div>

<div class="routine-wrapper" id="routineArea">

<table class="routine">
  <thead>
    <tr>
      <th>Day / Time</th>
      <th>08:30-09:45</th>
      <th>09:45-11:00</th>
      <th>11:00-12:15</th>
      <th>12:15-01:30</th>
      <th>01:30-02:45</th>
      <th>02:45-04:00</th>
      <th>04:00-05:15</th>
      <th>05:15-06:30</th>
    </tr>
  </thead>

  <tbody>
    <tr data-day="Sunday"><td class="day">Sunday</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr data-day="Monday"><td class="day">Monday</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr data-day="Tuesday"><td class="day">Tuesday</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr data-day="Wednesday"><td class="day">Wednesday</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr data-day="Thursday"><td class="day">Thursday</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
    <tr data-day="Friday"><td class="day">Friday</td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
  </tbody>
</table>

<button class="download-btn" onclick="downloadRoutine()">⬇ Download Routine</button>

</div>

<script src="/script.js"></script>
</body>
</html>
